<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <div class="page-frame">
    {% include nav.html %}

    <main class="content">
      <div class="content-inner">
        {% if page.title and page.hide_title != true %}
          <header class="page-header">
            <h1>{{ page.title }}</h1>
            {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
          </header>
          <div class="ornament" aria-hidden="true">&#10022;</div>
        {% endif %}

        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
